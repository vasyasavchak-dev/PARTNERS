<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partners</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0efe9;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#a0a09a;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --success-bg:#EAF3DE;--success-text:#3B6D11;
  --danger-bg:#FAECE7;--danger-text:#993C1D;
  --info-bg:#E6F1FB;--info-text:#185FA5;
  --warn-bg:#FAEEDA;--warn-text:#854F0B;
  --purple-bg:#EEEDFE;--purple-text:#3C3489;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg3);min-height:100vh;}
.app{max-width:1180px;margin:0 auto;padding:1.25rem 1.5rem;}
.hide{display:none !important;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.login-box{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:2rem;width:min(380px,100%);}
.login-logo{text-align:center;margin-bottom:1.5rem;}
.login-logo .mark{font-size:24px;font-weight:500;letter-spacing:0.06em;}
.login-logo .sub{font-size:12px;color:var(--text2);margin-top:4px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:40px;}
.pw-wrap input{padding-right:84px;}
.pw-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;color:var(--text2);font-size:12px;padding:5px 8px;border-radius:var(--radius);font-family:inherit;}
.pw-eye:hover{color:var(--text);background:var(--bg2);}
.lang-sw{display:flex;gap:4px;justify-content:center;margin-top:1rem;}
.lang-sw button{padding:3px 11px;border:0.5px solid var(--border);border-radius:100px;background:var(--bg);font-size:11px;cursor:pointer;color:var(--text2);}
.lang-sw button.on{background:var(--text);color:var(--bg);border-color:transparent;}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px;}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;letter-spacing:0.05em;}
.logo i{font-size:22px;}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);}
.admin-pill{padding:2px 9px;border-radius:100px;background:var(--purple-bg);color:var(--purple-text);font-size:11px;font-weight:500;}

.tabs{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:0.5px solid var(--border);flex-wrap:wrap;}
.tab{padding:8px 18px;cursor:pointer;border:none;background:none;font-size:14px;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500;}
.page{display:none;}
.page.active{display:block;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.25rem;}
.stat{background:var(--bg);border-radius:var(--radius);padding:12px 14px;border:0.5px solid var(--border);}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:4px;}
.stat-val{font-size:24px;font-weight:500;}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:8px;flex-wrap:wrap;}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:4px 12px;border:0.5px solid var(--border);border-radius:100px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--text2);}
.chip.active{background:var(--text);color:var(--bg);border-color:transparent;}
.search{padding:7px 12px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:13px;width:180px;background:var(--bg);color:var(--text);}
.sel{padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);}

.btn{padding:7px 14px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:13px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--bg2);}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent;}
.btn.primary:hover{opacity:0.85;}
.btn.danger{color:var(--danger-text);border-color:var(--danger-text);}
.btn.danger:hover{background:var(--danger-bg);}
.btn.sm{padding:4px 10px;font-size:12px;}
.btn:disabled{opacity:0.5;cursor:default;}
.icon-btn{width:28px;height:28px;border:0.5px solid var(--border);border-radius:var(--radius);background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);}
.icon-btn:hover{background:var(--bg2);color:var(--text);}

.card{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);overflow:hidden;}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{min-width:100%;}
/* Кнопки дій завжди видно, навіть коли таблиця ширша за екран */
#orders-head th:last-child,
#orders-body td:last-child{position:sticky;right:0;z-index:2;
  box-shadow:-7px 0 9px -9px rgba(0,0,0,0.35);}
#orders-head th:last-child{background:var(--bg2);}
#orders-body td:last-child{background:var(--bg);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 12px;color:var(--text2);font-weight:400;border-bottom:0.5px solid var(--border);white-space:nowrap;background:var(--bg2);}
td{padding:9px 12px;border-bottom:0.5px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--bg2);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:500;white-space:nowrap;}
.badge.paid{background:var(--success-bg);color:var(--success-text);}
.badge.unpaid{background:var(--danger-bg);color:var(--danger-text);}
.badge.shipped{background:var(--info-bg);color:var(--info-text);}
.badge.pending{background:var(--warn-bg);color:var(--warn-text);}
.badge.new{background:var(--purple-bg);color:var(--purple-text);}
.badge.off{background:var(--bg3);color:var(--text2);}

.dot{display:inline-block;width:13px;height:13px;border-radius:50%;border:0.5px solid var(--border2);vertical-align:-2px;margin-right:5px;flex-shrink:0;}
.dot.lg{width:17px;height:17px;}
.itemcell{min-width:170px;max-width:290px;}
#orders-head th,#orders-body td{padding:7px 8px;font-size:12.5px;}
#orders-body .buyer{max-width:165px;}
#orders-body .buyer .addr{font-size:10.5px;color:var(--text3);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hidmark{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:10px;
  color:var(--warn-text);cursor:help;}
#orders-body .badge{font-size:10.5px;padding:2px 7px;}
#orders-body .mono{font-size:11.5px;}
#orders-body .icon-btn{padding:3px 5px;}
.tapbadge{cursor:pointer;display:inline-block;}
#ver-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;
  display:flex;gap:12px;align-items:center;background:#2B2B29;color:#fff;
  padding:10px 14px;border-radius:100px;font-size:13px;
  box-shadow:0 6px 22px rgba(0,0,0,0.25);max-width:92vw;}
#ver-bar .btn{background:#fff;border-color:#fff;color:#2B2B29;white-space:nowrap;}
.chatpick{flex:1 0 100%;margin-top:6px;border:0.5px solid var(--border2);border-radius:var(--radius);
  background:var(--bg);overflow:hidden;}
.chatpick .cp-head{font-size:11px;color:var(--text3);padding:6px 9px;background:var(--bg2);}
.chatpick .cp-row{display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:7px 9px;font-size:12px;cursor:pointer;border-top:0.5px solid var(--border);}
.chatpick .cp-row:hover{background:var(--bg2);}
.chatpick .cp-row .mono{color:var(--text3);font-size:11px;}
.tapbadge:hover{filter:brightness(0.95);}
#orders-body .btn{font-size:11px;padding:4px 9px;}
.icell{display:flex;gap:9px;align-items:center;}
.iname{line-height:1.35;min-width:0;}
.opic{flex:0 0 auto;width:52px;height:40px;object-fit:contain;
  border-radius:7px;border:0.5px solid var(--border);background:var(--bg2);display:block;}
.opic.zoom{cursor:zoom-in;}
.opic.zoom:hover{border-color:var(--accent);}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.swatch{border:1.5px solid var(--border);border-radius:var(--radius);padding:7px;cursor:pointer;background:var(--bg);text-align:center;transition:border-color 0.12s;}
.swatch:hover{border-color:var(--border2);}
.swatch.on{border-color:var(--text);}
.swatch .chipc{width:100%;height:34px;border-radius:5px;border:0.5px solid var(--border);margin-bottom:5px;}
.swatch .nm{font-size:11px;line-height:1.25;}
.swatch .fin{font-size:10px;color:var(--text3);}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:center;justify-content:center;padding:1rem;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:1.5rem;width:min(600px,100%);max-height:90vh;overflow-y:auto;}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);}
.field textarea{min-height:64px;resize:vertical;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row .field{flex:1;min-width:130px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:0.5px solid var(--border);}
.sect{font-size:12px;color:var(--text2);font-weight:500;margin:1.25rem 0 0.6rem;padding-top:0.9rem;border-top:0.5px solid var(--border);}

.vrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.vrow input,.vrow select{padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);color:var(--text);min-width:0;}

/* Видимість по партнерах */
.vis-list{display:flex;flex-direction:column;gap:6px;}
.vis-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--bg);}
.vis-item:hover{background:var(--bg2);}
.vis-item input{width:auto;margin:0;}
.vis-item .nm{flex:1;font-size:13px;}
.vis-item .nm small{display:block;color:var(--text3);font-size:11px;}
.vis-item.off{opacity:0.55;}

.checks{display:flex;gap:14px;flex-wrap:wrap;}
.checks label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;}
.checks input{width:auto;}

.file-zone{border:0.5px dashed var(--border2);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;font-size:13px;color:var(--text2);}
.file-zone:hover{background:var(--bg2);}
.attachment{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:var(--radius);font-size:12px;margin-top:6px;}
.empty{text-align:center;padding:3rem;color:var(--text3);}
.comment{display:flex;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:var(--radius);font-size:12px;margin-top:6px;}
.comment-author{font-weight:500;white-space:nowrap;}
.comment-text{flex:1;}
.comment-time{font-size:11px;color:var(--text3);white-space:nowrap;}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin 0.6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:999;animation:fadeIn 0.2s ease;max-width:min(380px,90vw);}
.toast.success{background:var(--success-bg);color:var(--success-text);border:0.5px solid var(--success-text);}
.toast.error{background:var(--danger-bg);color:var(--danger-text);border:0.5px solid var(--danger-text);}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
.sync-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);margin-bottom:10px;flex-wrap:wrap;}
.fx-bar{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;background:var(--bg);border:0.5px solid var(--border);font-size:11px;white-space:nowrap;}
.fx-bar b{font-weight:500;color:var(--text);}
.fx-bar .sep{color:var(--text3);}

/* Категорії — горизонтальні чипси */
.cat-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1rem;}
.cat-item{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;
  border:0.5px solid var(--border);background:var(--bg);border-radius:100px;
  cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit;}
.cat-item:hover{background:var(--bg2);color:var(--text);border-color:var(--border2);}
.cat-item.on{background:var(--accent);color:#fff;border-color:transparent;}
.cat-item .n{font-size:11px;opacity:0.7;font-variant-numeric:tabular-nums;}
.plogo{width:26px;height:26px;border-radius:50%;object-fit:cover;border:0.5px solid var(--border);background:var(--bg2);flex-shrink:0;}
.plogo.sm{width:20px;height:20px;}
.plogo.lg{width:44px;height:44px;}
.logo-pick{display:flex;align-items:center;gap:12px;}
.logo-pick .hint{font-size:11px;color:var(--text3);}

/* ══════════ НОВА ТЕМА ТА БІЧНЕ МЕНЮ ══════════ */
:root{
  --bg:#ffffff;--bg2:#f4f6f5;--bg3:#e9edeb;
  --text:#16201c;--text2:#5c6b64;--text3:#93a29b;
  --border:rgba(22,32,28,0.12);--border2:rgba(22,32,28,0.22);
  --success-bg:#e3f0e4;--success-text:#2f6b35;
  --danger-bg:#fbe9e7;--danger-text:#a03d26;
  --info-bg:#e6eff7;--info-text:#1e5a8a;
  --warn-bg:#fbf0dc;--warn-text:#8a5a12;
  --purple-bg:#eaedfb;--purple-text:#3b3f8f;
  --accent:#2f6f4e;--accent-2:#245a3f;
  --side-bg:#16251d;--side-text:#c6d4cc;--side-hover:#20362a;
}
body{background:var(--bg3);}
.shell{display:flex;min-height:100vh;}
.side{width:216px;flex-shrink:0;background:var(--side-bg);color:var(--side-text);
  display:flex;flex-direction:column;padding:1.1rem 0.75rem;position:sticky;top:0;height:100vh;}
.side-logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;
  letter-spacing:0.08em;color:#fff;padding:4px 10px 1.2rem;}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.side .tab{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;
  border-radius:var(--radius);font-size:14px;color:var(--side-text);border:none;background:none;
  text-align:left;margin:0;cursor:pointer;font-family:inherit;}
.side .tab:hover{background:var(--side-hover);color:#fff;}
.side .tab.active{background:var(--accent);color:#fff;font-weight:500;}
.side-foot{border-top:1px solid rgba(255,255,255,0.1);padding-top:0.8rem;margin-top:0.8rem;}
.side-who{display:flex;align-items:center;gap:8px;padding:0 4px 9px;font-size:13px;color:#fff;}
.side-who .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;}
.side-who .nm small{display:block;font-size:11px;color:var(--side-text);font-weight:400;}
.side-acts{display:flex;gap:6px;}
.side-acts .icon-btn{border-color:rgba(255,255,255,0.18);color:var(--side-text);flex:1;}
.side-acts .icon-btn:hover{background:var(--side-hover);color:#fff;}
.main{flex:1;min-width:0;padding:1.25rem 1.6rem 2.5rem;max-width:none;}
.tabs{border:none;margin:0;}
.admin-pill{background:rgba(255,255,255,0.15);color:#fff;}

.btn.primary{background:var(--accent);border-color:transparent;color:#fff;}
.btn.primary:hover{background:var(--accent-2);opacity:1;}
.chip.active{background:var(--accent);color:#fff;}
.cat-item.on{background:var(--accent);color:#fff;}
.swatch.on{border-color:var(--accent);}
.lang-sw button.on{background:var(--accent);border-color:transparent;color:#fff;}
.role-pill{background:var(--accent-soft,#e4efe9);color:var(--accent);}

/* код країни замість емодзі-прапорця (Windows їх не малює) */
/* Картки товарів */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;}
.pcard{position:relative;background:var(--bg);border:0.5px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;
  transition:box-shadow .14s,border-color .14s;}
.pcard:hover{box-shadow:0 3px 14px rgba(22,32,28,0.09);border-color:var(--border2);}
.pphoto{position:relative;aspect-ratio:4/3;flex:none;min-height:0;overflow:hidden;
  background:var(--bg2);display:flex;align-items:center;
  justify-content:center;color:var(--text3);font-size:11px;}
.pphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  cursor:zoom-in;display:block;}
.pbody{padding:12px 13px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 2px;}
.pskus{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
.pskus .sk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
  background:var(--bg2);border:0.5px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--text2);}
.pcat{font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:var(--text3);}
.pname{font-size:14px;font-weight:500;line-height:1.3;}
.psku{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text2);}
.phid{font-size:10px;color:var(--warn-text);background:var(--warn-bg);
  border-radius:var(--radius);padding:3px 7px;line-height:1.35;}
.pvars{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.pv{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--bg2);
  border:0.5px solid var(--border);border-radius:100px;padding:2px 8px;color:var(--text2);}
.pv .dot{width:10px;height:10px;margin:0;}
.pv.count{background:none;border-color:var(--border2);color:var(--text);font-weight:500;}
.pprice{margin-top:auto;padding-top:9px;font-size:14px;}
.pacts{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .14s;}
.pcard:hover .pacts{opacity:1;}
.pacts .icon-btn{background:rgba(255,255,255,0.94);border-color:var(--border);}
@media (hover:none){.pacts{opacity:1;}}

/* Масовий вибір замовлень */
.selbar{display:none;align-items:center;gap:10px;background:var(--side-bg);color:#fff;
  border-radius:var(--radius-lg);padding:9px 14px;margin-bottom:0.9rem;flex-wrap:wrap;}
.selbar.on{display:flex;}
.selbar .n{font-size:13px;font-weight:500;}
.selbar .btn{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.22);color:#fff;}
.selbar .btn:hover{background:rgba(255,255,255,0.2);}
td.selcell,th.selcell{width:34px;padding-left:14px;padding-right:0;}
tr.rowsel td{background:var(--accent-soft,#e4efe9) !important;}

/* Вкладки в картці товару */
.ptabs{display:flex;gap:4px;margin:-0.4rem 0 1.1rem;border-bottom:0.5px solid var(--border);}
.ptab{padding:7px 14px;border:none;background:none;cursor:pointer;font-size:13px;
  color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;}
.ptab:hover{color:var(--text);}
.ptab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:500;}
.pbadge{display:none;margin-left:6px;font-size:10px;font-weight:600;background:var(--bg3);

.pbadge.on{display:inline-block;}
.ptab.active .pbadge{background:var(--accent);color:#fff;}

/* Групи опцій */
.ogroup{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:11px;
  margin-bottom:10px;background:var(--bg2);}
.ohead{display:flex;gap:7px;align-items:center;margin-bottom:9px;}
.ohead input{flex:1;padding:6px 10px;font-size:13px;border:0.5px solid var(--border2);
  border-radius:var(--radius);background:var(--bg);color:var(--text);}
.ohead select{width:104px;padding:6px 8px;font-size:12px;border:0.5px solid var(--border2);
  border-radius:var(--radius);background:var(--bg);color:var(--text);}
.greq{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);
  white-space:nowrap;cursor:pointer;user-select:none;}
.greq input[type=checkbox]{flex:0 0 auto;width:14px;height:14px;padding:0;margin:0;
  border-radius:3px;accent-color:var(--accent);cursor:pointer;}
.opick label .opt{font-weight:400;font-size:11px;color:var(--text3);}
.opick label .gpx{font-weight:500;color:var(--text);}
.swatch.none .chipc{background:repeating-linear-gradient(45deg,var(--bg2) 0 6px,var(--bg) 6px 12px);
  display:flex;align-items:center;justify-content:center;}
.swatch.none .chipc::after{content:'—';color:var(--text3);font-size:15px;}
.ochoice{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--bg);
  border:0.5px solid var(--border);border-radius:var(--radius);padding:7px;margin-bottom:6px;}
.ochoice input,.ochoice select{padding:5px 8px;font-size:12px;border:0.5px solid var(--border2);
  border-radius:var(--radius);background:var(--bg);color:var(--text);min-width:0;}
.oimgs{display:flex;gap:5px;align-items:center;flex-wrap:wrap;width:100%;margin-top:3px;}
.oimg{position:relative;width:54px;}
.oimg .pic{width:54px;height:42px;border-radius:5px;border:0.5px solid var(--border);
  background:var(--bg2) center/contain no-repeat;display:block;}
.oimg .cap{width:54px;font-size:9px;text-align:center;border:none;background:none;
  color:var(--text2);padding:2px 0;}
.oimg .rm{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
  border:none;background:var(--danger-text);color:#fff;font-size:10px;line-height:1;cursor:pointer;}
.oadd{width:54px;height:42px;border:0.5px dashed var(--border2);border-radius:5px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:16px;}
.oadd:hover{border-color:var(--accent);color:var(--accent);}

/* Вибір опцій у замовленні */
.psearch{margin-bottom:6px;}
.pfound{font-size:11px;color:var(--text3);margin:-2px 0 5px;}
.pfound.none{color:var(--danger-text);}
.opick{margin-bottom:0.9rem;}
.opick > label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
.ogal{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;}
.ogal .g{width:76px;}
.ogal .g .pic{width:76px;height:58px;border-radius:6px;border:0.5px solid var(--border);
  background:var(--bg2) center/contain no-repeat;cursor:zoom-in;display:block;}
.ogal .g .cap{font-size:10px;color:var(--text3);text-align:center;margin-top:2px;}

.vbox{border:0.5px solid var(--border);border-radius:var(--radius);padding:8px;margin-bottom:8px;background:var(--bg2);}
.vbox .vrow{margin-bottom:0;}
.vattrs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px;padding-top:7px;
  border-top:0.5px dashed var(--border);}
.achip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--bg);
  border:0.5px solid var(--border);border-radius:100px;padding:3px 5px 3px 9px;color:var(--text2);}
.achip b{font-weight:500;color:var(--text);}
.achip button{border:none;background:none;cursor:pointer;color:var(--text3);
  font-size:13px;line-height:1;padding:0 2px;}
.achip button:hover{color:var(--danger-text);}
.attr-add{display:inline-flex;gap:4px;align-items:center;}
.attr-add input{padding:3px 7px;font-size:11px;border:0.5px solid var(--border2);
  border-radius:100px;background:var(--bg);color:var(--text);width:108px;}
.btn.xs{padding:3px 9px;font-size:11px;border-radius:100px;}
.cimg{width:40px;height:40px;border-radius:var(--radius);border:0.5px solid var(--border2);
  background:var(--bg2) center/cover no-repeat;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:15px;}
.cimg:hover{border-color:var(--accent);}
.photo-pick{display:flex;align-items:center;gap:12px;}
.photo-prev{width:88px;height:88px;border-radius:var(--radius);object-fit:cover;
  border:0.5px solid var(--border);background:var(--bg2);flex-shrink:0;}
.photo-prev.empty{display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px;}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;border:0.5px solid var(--border);background:var(--bg2);}
img.thumb{cursor:zoom-in;}
.photo-big{max-width:100%;max-height:70vh;border-radius:var(--radius);display:block;margin:0 auto;}
.cc{display:inline-block;font-size:10px;font-weight:600;letter-spacing:0.04em;
  background:var(--bg2);border:0.5px solid var(--border);border-radius:4px;
  padding:1px 5px;color:var(--text2);vertical-align:1px;}

@media (max-width:860px){
  .shell{flex-direction:column;}
  .side{width:100%;height:auto;position:static;padding:0.8rem;}
  .side-nav{flex-direction:row;flex-wrap:wrap;}
  .side .tab{width:auto;}
  .side-foot{display:flex;align-items:center;gap:10px;}
  .side-who{padding:0;flex:1;}
  .main{padding:1rem;}
}

<div class="login-wrap" id="login-screen">

function L() { return DICT[LANG] || DICT.uk; }
function t(k, vars) {
  let s = L()[k];
  if (s === undefined) s = DICT.uk[k] !== undefined ? DICT.uk[k] : k;
  if (vars) Object.keys(vars).forEach(v => { s = s.split('{' + v + '}').join(vars[v]); });
  return s;
}
function errMsg(m) {
  if (!m) return t('error');
  if (LANG === 'en') {
    if (ERR_EN[m]) return ERR_EN[m];
    const hit = Object.keys(ERR_EN).find(k => String(m).indexOf(k) === 0);
    if (hit) return ERR_EN[hit];
  }
  return m;
}

/* ── Гроші: завжди показуємо обидві валюти ── */
function sym(c) { return c === 'EUR' ? '€' : '$'; }
function fmtNum(n) {
  return (+n).toLocaleString(L().locale, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function conv(a, from, to) {
  if (from === to) return +a;
  if (!fx.eurUsd) return null;
  return from === 'EUR' ? +a * fx.eurUsd : +a / fx.eurUsd;
}
function money(a, c) {
  if (a === '' || a === null || a === undefined || isNaN(+a)) return '<span style="color:var(--text3)">—</span>';
  const cc = c === 'EUR' ? 'EUR' : 'USD';
  return `<span style="font-weight:500;">${sym(cc)}${fmtNum(a)}</span>`;
}
function myCur() { return ME && ME.currency === 'EUR' ? 'EUR' : 'USD'; }

// Знімок кольору з палітри за його назвою
function colorImg(name) {
  const c = colors.find(x => x.name === name);
  return c && c.img ? c.img : '';
}

// Стиль для кружечка / квадратика кольору: фото, якщо є, інакше заливка
function colorStyle(hex, name) {
  const im = colorImg(name);
  return im
    ? `background-image:url(${im});background-size:cover;background-position:center;`
    : `background:${hex || '#e6e4dd'};`;
}

// Смужка з курсами валют у шапці
function renderFx() {
  const el = $('fx-bar');
  if (!el) return;
  if (!fx.eurUsd) { el.classList.add('hide'); return; }
  el.classList.remove('hide');
  const parts = ['1 € = <b>' + fmtNum(fx.eurUsd) + ' $</b>'];
  if (fx.usdUah) parts.push('1 $ = <b>' + fmtNum(fx.usdUah) + ' ₴</b>');
  if (fx.eurUah) parts.push('1 € = <b>' + fmtNum(fx.eurUah) + ' ₴</b>');
  el.innerHTML = parts.join('<span class="sep">·</span>') +
    '<span class="sep">·</span><span style="color:var(--text3)">' +
    t('nbuOn', { d: fx.date || '' }) + (fx.stale ? ' ⚠' : '') + '</span>';
}
function curOpts(sel) {
  return ['USD','EUR'].map(c =>
    `<option value="${c}" ${c === (sel || 'USD') ? 'selected' : ''}>${c} ${sym(c)}</option>`).join('');
}

/* ══════════ API ══════════ */
function api(action, data) {
  const payload = Object.assign({ token: TOKEN }, data || {});
  return new Promise(resolve => {
    google.script.run
      .withSuccessHandler(r => {
        let res; try { res = JSON.parse(r); } catch (e) { res = { error: t('error') }; }
        if (res && res._v) checkVer(res._v);
        if (res && res.error === 'AUTH') { forceLogout(''); resolve(null); return; }
        resolve(res);
      })
      .withFailureHandler(err => resolve({ error: t('srvFail') + ': ' + ((err && err.message) || '—') }))
      .apiCall(action, JSON.stringify(payload));
  });
}

async function doLogin() {
  const login = val('l-login').trim(), password = val('l-pass');
  const err = $('l-err'), btn = $('l-btn');
  if (!login || !password) { err.textContent = t('enterBoth'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const res = await api('login', { login, password });
  btn.disabled = false; btn.textContent = t('signIn');
  if (!res) { err.textContent = t('noConn'); return; }
  if (res.error === 'LOCKED') { err.textContent = t('lockedFor', { n: Math.ceil(res.wait / 60) }); return; }
  if (res.error) { err.textContent = errMsg(res.error); return; }
  TOKEN = res.token;
  localStorage.setItem('gs_token', TOKEN);
  ME = res.user;
  startApp();
}

function forceLogout(msg) {
  TOKEN = ''; ME = null;
  localStorage.removeItem('gs_token');
  $('app-screen').classList.add('hide');
  $('login-screen').classList.remove('hide');
  $('l-err').textContent = msg || '';
  $('l-pass').value = '';
}
async function doLogout() { await api('logout', {}); forceLogout(''); }

/* ══════════ СТАРТ ══════════ */
async function boot() {
  paintStatic();
  const vr = $('ui-ver');
  if (vr) vr.textContent = UI_VER;
  if (!TOKEN) return;
  const res = await api('me', {});
  if (res && res.user) { ME = res.user; checkVer(res.ver); startApp(); }
}

// Сторінка з кеша браузера — просимо оновити
function checkVer(serverVer) {
  if (!serverVer || serverVer === UI_VER || $('ver-bar')) return;
  const d = document.createElement('div');
  d.id = 'ver-bar';
  document.body.appendChild(d);
  verBarText();
}

function verBarText() {
  const d = $('ver-bar');
  if (!d) return;
  d.innerHTML = `<span>${t('needReload')}</span>
    <button class="btn sm" onclick="hardReload()">${t('reloadBtn')}</button>`;
}

/* Застосунок живе в iframe (GitHub Pages → Apps Script → наш код).
   location.reload() усередині пісочниці Google дає білий екран,
   тому просимо перезавантажитись зовнішню сторінку. */
function hardReload() {
  let framed = true;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!framed) { location.reload(); return; }

  try { window.top.postMessage('partners-reload', '*'); } catch (e) {}
  try { window.parent.postMessage('partners-reload', '*'); } catch (e) {}

  setTimeout(() => {                       // оболонка не відгукнулась — підказка
    const d = $('ver-bar');
    if (d) d.innerHTML = `<span>${t('reloadHint')}</span>`;
  }, 1500);
}

function startApp() {
  if (ME.lang && ME.lang !== LANG) setLangLocal(ME.lang);
  $('login-screen').classList.add('hide');
  $('app-screen').classList.remove('hide');
  $('me-name').textContent = ME.company || ME.name;
  const ap = $('me-admin');
  ap.textContent = t('admin');
  ap.classList.toggle('hide', !ME.admin);
  const ml = $('me-logo');
  if (ME.logo) { ml.src = ME.logo; ml.classList.remove('hide'); } else ml.classList.add('hide');
  paintStatic();
  buildTabs();
  loadAll();
}

function buildTabs() {
  const list = [['orders','tabOrders']];
  if (ME.admin) list.push(['products','tabProducts'], ['log','tabLog'], ['users','tabUsers']);
  const cur = document.querySelector('.tab.active');
  const active = cur ? (cur.getAttribute('onclick').match(/'(\w+)'/) || [])[1] : 'orders';
  $('tabs').innerHTML = list.map(x =>
    `<button class="tab${x[0] === active ? ' active' : ''}" onclick="showTab('${x[0]}')">${t(x[1])}</button>`).join('');
  showTab(list.some(x => x[0] === active) ? active : 'orders');
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(el =>
    el.classList.toggle('active', el.getAttribute('onclick').indexOf("'" + tab + "'") > -1));
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('active', el.id === 'tab-' + tab));
  if (tab === 'log') loadLogs();
  if (tab === 'users') loadUsers();
}

/* ══════════ ЗАВАНТАЖЕННЯ ══════════ */
async function loadAll() {
  sync(true);
  try {
    const [o, p, c, pr, r] = await Promise.all([
      api('getOrders', {}), api('getProducts', {}), api('getColors', {}),
      api('getPartners', {}), api('getRate', {})
    ]);
    if (o  && !o.error)  orders   = o.orders    || [];
    if (p  && !p.error)  products = p.products  || [];
    if (c  && !c.error)  colors   = c.colors    || [];
    if (pr && !pr.error) partners = pr.partners || [];
    if (r  && r.eurUsd)  fx = r;
    renderFx();
    renderOrders();
    renderProducts();
  } catch (e) {
    toast(t('renderErr', { m: e.message }), 'error');

    sync(false);
    $('last-sync').textContent = t('updatedAt', { t: new Date().toLocaleTimeString(L().locale) });
  }
}

function selAll(el) {

function selBar() {

function renderStats() {
  const o = orders;
  $('stats-bar').innerHTML =
    stat(t('stTotal'), o.length, '') +
    stat(t('stUnpaid'), o.filter(x => x.payment === 'unpaid').length, 'var(--danger-text)') +
    stat(t('stPending'), o.filter(x => x.status === 'pending').length, 'var(--warn-text)') +
    stat(t('stShipped'), o.filter(x => x.status === 'shipped').length, 'var(--success-text)');
}
function stat(l, v, c) {
  return `<div class="stat"><div class="stat-label">${l}</div><div class="stat-val"${c ? ` style="color:${c}"` : ''}>${v}</div></div>`;
}

// Замовлення за поточними фільтрами, крім вибору партнера
function baseList() {
  const q = val('search').toLowerCase();
  return orders
    .filter(o => filter === 'all'
      || (filter === 'unpaid' && o.payment === 'unpaid')
      || (filter !== 'unpaid' && o.status === filter))
    .filter(o => monthFilter === 'all' || monthKey(o) === monthFilter)
    .filter(o => !q || [o.buyer, o.table, o.track, o.track2, o.buyerEmail, o.note, cname(o.country), fmtDate(o.created)]
      .join(' ').toLowerCase().indexOf(q) > -1);
}

// Сума замовлень по валютах
function sumOf(list) {
  const by = {};
  list.forEach(o => {
    if (o.price === '' || o.price == null || isNaN(+o.price)) return;
    const c = o.currency === 'EUR' ? 'EUR' : 'USD';
    by[c] = (by[c] || 0) + (+o.price) * (+o.qty || 1);
  });
  return Object.keys(by).map(c => sym(c) + fmtNum(Math.round(by[c]))).join(' · ');
}

// Чи бачить цей партнер замовлення: не приховане ні замовлення, ні його товар
function partnerSees(uid, o) {
  if ((o.hiddenFor || []).indexOf(uid) > -1) return false;
  const p = products.find(x => x.id === o.productId);
  return !(p && (p.hiddenFor || []).indexOf(uid) > -1);
}

function renderPartners() {
  const sel = $('partner-sel');
  if (!sel) return;
  const list = partners.filter(p => !p.admin);
  if (!ME || !ME.admin || !list.length) { sel.classList.add('hide'); return; }
  sel.classList.remove('hide');
  const base = baseList();
  sel.innerHTML = `<option value="all">${t('allPartners')}</option>` + list.map(p => {
    const n = base.filter(o => partnerSees(p.id, o)).length;
    return `<option value="${p.id}">${esc(p.company || p.name)} (${n})</option>`;
  }).join('');
  sel.value = list.some(p => p.id === partnerFilter) ? partnerFilter : 'all';
  if (sel.value === 'all') partnerFilter = 'all';
}

function setPartner(v) { partnerFilter = v; renderOrders(); }

function renderMonths() {
  const keys = [...new Set(orders.map(monthKey).filter(Boolean))].sort().reverse();
  const sel = $('month-sel'), prev = monthFilter;
  sel.innerHTML = `<option value="all">${t('allMonths')}</option>` + keys.map(k => {
    const [y, m] = k.split('-');
    const cnt = orders.filter(o => monthKey(o) === k).length;
    return `<option value="${k}">${L().months[+m - 1]} ${y} (${cnt})</option>`;
  }).join('');
  sel.value = keys.indexOf(prev) > -1 ? prev : 'all';
  if (sel.value === 'all') monthFilter = 'all';
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.chip').forEach(el => el.classList.toggle('active', el.dataset.f === f));
  renderOrders();
}
function setMonth(v) { monthFilter = v; renderOrders(); }

function payBadge(o) {
  return o.payment === 'paid'
    ? `<span class="badge paid"><i class="ti ti-check" style="font-size:11px"></i>${t('paid')}</span>`
    : `<span class="badge unpaid"><i class="ti ti-clock" style="font-size:11px"></i>${t('unpaid')}</span>`;
}
function stBadge(o) {
  const m = { shipped:['shipped','ti-truck'], pending:['pending','ti-package'], new:['new','ti-sparkles'] };
  const k = m[o.status] ? o.status : 'new';
  return `<span class="badge ${m[k][0]}"><i class="ti ${m[k][1]}" style="font-size:11px"></i>${t(ST_KEYS[k])}</span>`;
}

function trackUrl(carrier, track) {
  const x = String(track || '').replace(/\s/g, '');
  if (!x) return null;
  const u = {
    ups:'https://www.ups.com/track?tracknum=' + x,
    fedex:'https://www.fedex.com/apps/fedextrack/?tracknumbers=' + x,
    usps:'https://tools.usps.com/go/TrackConfirmAction?tLabels=' + x,
    dhl:'https://www.dhl.com/en/home/tracking.html?tracking-id=' + x,
    nova:'https://novaposhta.ua/tracking/?cargo_number=' + x
  };
  return u[carrier] || null;
}

function trackCell(o) {
  if (!o.track && !o.track2)
    return `<button class="btn sm" onclick="openTrack('${o.id}')"><i class="ti ti-plus"></i>${t('colTrack')}</button>`;
  const one = (tr, car) => {
    if (!tr) return '';
    const url = trackUrl(car, tr);
    const lbl = CARRIERS[car] || '';
    const span = url
      ? `<a href="${url}" target="_blank" class="mono" style="color:var(--info-text);text-decoration:none;">${esc(tr)}</a>`
      : `<span class="mono">${esc(tr)}</span>`;
    return `<div style="display:flex;align-items:center;gap:4px;">${
      lbl ? `<span style="font-size:10px;background:var(--bg2);padding:1px 5px;border-radius:4px;">${lbl}</span>` : ''}${span}</div>`;
  };
  return `<div style="display:flex;align-items:center;gap:4px;">
      <div>${one(o.track, o.carrier)}${one(o.track2, o.carrier2)}${
        o.trackStatus ? `<div style="font-size:11px;color:var(--text2);margin-top:2px;">${esc(o.trackStatus)}</div>` : ''}</div>
      <button class="icon-btn" onclick="openTrack('${o.id}')" title="${t('edit')}"><i class="ti ti-edit" style="font-size:12px"></i></button>
    </div>`;
}

// Мініатюра товару в картці замовлення
function prodThumb(o) {
  const p = products.find(x => x.id === o.productId);
  return p && p.thumb
    ? `<img class="thumb" src="${p.thumb}" alt="" style="vertical-align:middle;margin-right:8px;" onclick="openPhoto('${p.id}')">`
    : '';
}

// Перша кольорова опція замовлення
function orderColor(o) {
  const p = products.find(x => x.id === o.productId);
  if (!p) return null;
  let found = null;
  (o.picks || []).forEach(pk => {
    if (found) return;
    const g = (p.options || []).find(x => x.id === pk.g);
    if (!g || g.kind !== 'color') return;
    found = g.choices.find(c => c.id === pk.c) || null;
  });
  return found;
}

function variantDot(o) {
  const c = orderColor(o);
  if (!c) return '';
  const im = (c.imgs && c.imgs[0] && c.imgs[0].thumb) || '';
  const st = im
    ? `background-image:url(${im});background-size:cover;background-position:center;`
    : colorStyle(c.hex, c.label);
  return `<span class="dot" style="${st}"></span>`;
}

// Фото в таблиці на всю ширину колонки: обраний колір, інакше головне фото товару
function orderPic(o) {
  const p = products.find(x => x.id === o.productId);
  const c = orderColor(o);
  const ci = c && c.imgs && c.imgs[0];
  const src = (ci && ci.thumb) || (p && p.thumb) || '';
  if (!src) {
    return c && c.hex
      ? `<span class="opic swatchonly" style="${colorStyle(c.hex, c.label)}"></span>` : '';
  }
  // оригінал підвантажиться з Drive, коли рядок потрапить на екран
  let lazy = '', click = '';
  if (ci && ci.photoId) {
    lazy = `data-photo="${ci.photoId}" data-prod="${o.productId}"`;
    click = `openChoicePhoto('${o.productId}','${ci.photoId}','${esc(ci.thumb || '')}')`;
  } else if (p && p.photoId) {
    lazy = `data-pid="${p.id}"`;
    click = `openPhoto('${p.id}')`;
  }
  const key = (ci && ci.photoId) || (p && p.id) || '';
  return `<img class="opic${click ? ' zoom' : ''}" alt="" src="${photoCache[key] || src}"
    ${photoCache[key] ? '' : lazy} ${click ? `onclick="${click}"` : ''}
    title="${esc(c ? c.label : (p ? p.name : ''))}">`;
}

// Підказка з конвертацією під полем ціни
function showConv() {
  const el = $('conv-hint');
  if (!el) return;
  el.innerHTML = '';          // у замовленнях конвертацію не показуємо — курси є в шапці

function statusOpts(cur) {
  return ['new','pending','shipped'].map(s =>
    `<option value="${s}" ${cur === s ? 'selected' : ''}>${t(ST_KEYS[s])}</option>`).join('');
}

function onProductPick(preset) {
  const p = products.find(x => x.id === val('f-product'));
  const vw = $('variant-wrap'), cw = $('custom-wrap');
  if (!p) { vw.innerHTML = ''; cw.classList.remove('hide'); return; }
  cw.classList.add('hide');
  const groups = p.options || [];
  if (!groups.length) {
    vw.innerHTML = `<div style="font-size:12px;color:var(--text3);margin-bottom:1rem;">${t('noVariants')}</div>`;
    basePrice(p);
    showShip();
    return;
  }
  const picks = {};
  (preset || []).forEach(x => { picks[x.g] = x.c; });

  vw.innerHTML = groups.map(g => {
    const cur = picks[g.id] || '';
    const req = g.req !== false;
    const gp = g.price !== '' && g.price != null
      ? ` <span class="gpx">${sym(g.currency)}${fmtNum(g.price)}</span>` : '';
    const lab = `<label>${esc(g.name)} ${req ? '*' : `<span class="opt">${t('optGroup')}</span>`}${gp}</label>`;
    if (g.kind === 'color') {
      return `<div class="opick" data-g="${g.id}" data-req="${req ? 1 : 0}">${lab}
        <div class="swatches">${req ? '' : `
          <div class="swatch none${cur ? '' : ' on'}" data-c="" onclick="pickChoice(this)">
            <div class="chipc none"></div>
            <div class="nm">${t('noPick')}</div>
          </div>`}${g.choices.map(c => `
          <div class="swatch${cur === c.id ? ' on' : ''}" data-c="${c.id}" onclick="pickChoice(this)">
            <div class="chipc" style="${c.imgs && c.imgs[0] && c.imgs[0].thumb
              ? `background-image:url(${c.imgs[0].thumb});background-size:cover;background-position:center;`
              : colorStyle(c.hex, c.label)}"></div>
            <div class="nm">${esc(c.label)}</div>
            ${c.sku ? `<div class="fin mono">${esc(c.sku)}</div>` : ''}
          </div>`).join('')}</div>
        <div class="ogal"></div></div>`;
    }
    return `<div class="opick" data-g="${g.id}" data-req="${req ? 1 : 0}">${lab}
      <select class="osel" onchange="pickSel(this)">
        <option value="">${req ? t('selectOption') : t('noPick')}</option>
        ${g.choices.map(c => `<option value="${c.id}" ${cur === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
      </select></div>`;
  }).join('');
  applyPicks();
  showShip();
}

/* Пошук товару у формі замовлення — за назвою, категорією та SKU (товару й варіанта) */
function filterProdOpts() {
  const q = val('f-psearch').trim().toLowerCase();
  const sel = $('f-product'), hint = $('f-pfound');
  const opts = [...sel.options].slice(1);          // крім «вручну»
  let shown = 0, only = null;
  opts.forEach(op => {
    const ok = !q || (op.dataset.find || '').indexOf(q) > -1;
    op.hidden = !ok;
    op.disabled = !ok;
    if (ok) { shown++; only = op; }
  });
  if (!q) { hint.textContent = ''; return; }
  hint.textContent = shown ? t('found', { n: shown }) : t('foundNone');
  hint.className = 'pfound' + (shown ? '' : ' none');
  if (shown === 1 && sel.value !== only.value) {
    sel.value = only.value;
    onProductPick();
  }
  if (shown >= 1) pickBySku(q);
}

// Якщо введене — SKU варіанта, одразу позначаємо цей варіант
function pickBySku(q) {
  const p = products.find(x => x.id === val('f-product'));
  if (!p) return;
  (p.options || []).forEach(g => (g.choices || []).forEach(c => {
    if (!c.sku || c.sku.toLowerCase() !== q) return;
    const box = document.querySelector(`#variant-wrap .opick[data-g="${g.id}"]`);
    if (!box) return;
    const sel = box.querySelector('.osel');
    if (sel) { sel.value = c.id; }
    else {
      box.querySelectorAll('.swatch').forEach(x => x.classList.toggle('on', x.dataset.c === c.id));
    }
    applyPicks();
  }));
}

// Скільки коштує доставка обраного товару в обрану країну
function showShip() {
  const el = $('ship-hint');
  if (!el) return;
  const p = products.find(x => x.id === val('f-product'));
  const cc = val('f-country');
  const s = p ? shipFor(p, cc) : null;
  if (!s) { el.textContent = ''; return; }
  const qty = Math.max(1, +val('f-qty') || 1);
  const total = (+s.price || 0) * qty;
  el.textContent = t('shipFor', { c: cname(cc), p: sym(s.currency) + fmtNum(total) });
}

// Зміна валюти: для товару без варіантів підставляємо ціну в новій валюті
function curChanged() {
  const p = products.find(x => x.id === val('f-product'));
  if (p && !(p.options || []).length) basePrice(p);
  showConv();
}

// Ціна товару без варіантів: беремо ту валюту, що вибрана у формі
function basePrice(p) {
  if (!$('f-price')) return;
  const pu = p.priceUsd !== '' && p.priceUsd != null && !isNaN(+p.priceUsd) ? +p.priceUsd : null;
  const pe = p.priceEur !== '' && p.priceEur != null && !isNaN(+p.priceEur) ? +p.priceEur : null;
  if (pu === null && pe === null) return;
  const want = val('f-cur') === 'EUR' ? 'EUR' : 'USD';
  if (want === 'EUR' && pe !== null)      { $('f-price').value = pe; $('f-cur').value = 'EUR'; }
  else if (want === 'USD' && pu !== null) { $('f-price').value = pu; $('f-cur').value = 'USD'; }
  else if (pu !== null)                   { $('f-price').value = pu; $('f-cur').value = 'USD'; }
  else                                    { $('f-price').value = pe; $('f-cur').value = 'EUR'; }
  showConv();
}

function pickChoice(el) {
  el.closest('.opick').querySelectorAll('.swatch').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
  applyPicks();
}
function pickSel() { applyPicks(); }

// Поточний вибір по всіх групах
function currentPicks() {
  const p = products.find(x => x.id === val('f-product'));
  if (!p) return [];
  return [...document.querySelectorAll('#variant-wrap .opick')].map(box => {
    const gid = box.dataset.g;
    const g = (p.options || []).find(x => x.id === gid);
    const sel = box.querySelector('.osel');
    const cid = sel ? sel.value : (box.querySelector('.swatch.on') || {}).dataset?.c || '';
    const c = g ? g.choices.find(x => x.id === cid) : null;
    return { g: gid, c: cid, req: box.dataset.req !== '0',
             gname: g ? g.name : '', label: c ? c.label : '', choice: c };
  });
}

// Галерея фото обраного кольору + ціна з опції
function applyPicks() {
  const picks = currentPicks();
  picks.forEach(pk => {
    const box = document.querySelector(`#variant-wrap .opick[data-g="${pk.g}"]`);
    const gal = box && box.querySelector('.ogal');
    if (!gal) return;
    const imgs = (pk.choice && pk.choice.imgs) || [];
    gal.innerHTML = imgs.map(im => `<div class="g">
      <span class="pic" style="background-image:url(${im.thumb || ''})"
        onclick="openChoicePhoto('${val('f-product')}','${im.photoId || ''}','${esc(im.thumb || '')}')"></span>
      ${im.cap ? `<div class="cap">${esc(im.cap)}</div>` : ''}</div>`).join('');
  });
  // ціну задає остання обрана група, в якої вона вказана
  const prod = products.find(x => x.id === val('f-product'));
  let price = null, cur = myCur();
  picks.forEach(pk => {
    if (!pk.c) return;
    const g = prod && (prod.options || []).find(x => x.id === pk.g);
    if (g && g.price !== '' && g.price != null) { price = g.price; cur = g.currency || 'USD'; }
  });
  if (price !== null && $('f-price')) {
    $('f-price').value = price;
    $('f-cur').value = cur;
    showConv();
  }
}

async function saveOrder(id) {
  const buyer = val('f-buyer').trim();
  const pid = val('f-product');
  const p = products.find(x => x.id === pid);
  let table = '', picks = [];
  if (p) {
    picks = currentPicks();
    if (picks.some(x => x.req && !x.c)) { toast(t('pickVariant'), 'error'); return; }
    picks = picks.filter(x => x.c);                       // не обрані необов'язкові групи пропускаємо
    const txt = picks.map(x => x.label).filter(Boolean).join(', ');
    table = p.name + (txt ? ' — ' + txt : '');
    picks = picks.map(x => ({ g: x.g, c: x.c, gname: x.gname, label: x.label }));
  } else table = val('f-custom').trim();
  if (!buyer || !table) { toast(t('needBuyerItem'), 'error'); return; }

  const cs = $('f-country');
  const vat = val('f-vat').trim(), buyerEmail = val('f-bmail').trim();
  const note = val('f-note').trim();
  const data = { buyer, table, vat, buyerEmail, productId: pid, variantId: '', picks, qty: val('f-qty') || 1,
                 street: val('f-street').trim(), city: val('f-city').trim(),
                 state: val('f-state').trim(), zip: val('f-zip').trim(),
                 phone: val('f-phone').trim(),
                 country: cs.value, countryLabel: COUNTRIES[cs.value] ? COUNTRIES[cs.value][2] : cs.value,
                 price: val('f-price'), currency: val('f-cur'),
                 payment: val('f-pay'), status: val('f-status'), note, hiddenFor: pickedHidden() };
  busy('save-btn');
  const res = id ? await api('updateOrder', Object.assign({ id }, data)) : await api('addOrder', data);
  if (res && !res.error) { toast(id ? t('saved') : t('orderAdded')); closeModal(); loadAll(); }
  else { toast(errMsg(res && res.error), 'error'); unbusy('save-btn', t('save')); }
}

/* ══════════ ПЕРЕГЛЯД ══════════ */
// Адреса доставки окремими рядками; якщо полів немає — старий текст із примітки
function addrRows(o) {
  const row = (lbl, v) => v
    ? `<tr><td style="color:var(--text2);padding:6px 0;">${lbl}</td><td>${esc(v)}</td></tr>` : '';
  const has = o.street || o.city || o.state || o.zip || o.phone;
  if (!has) return '';
  const name = row(t('colBuyer'), o.buyer);
  return `<tr><td colspan="2" style="padding:10px 0 2px;font-size:11px;letter-spacing:0.06em;
      text-transform:uppercase;color:var(--text3);">${t('secShipping')}
      <button class="btn xs" style="margin-left:8px;" onclick="copyAddr('${o.id}')">
        <i class="ti ti-copy"></i> ${t('copy')}</button></td></tr>` +
    name +
    row(t('street'), o.street) +
    row(t('city'), o.city) +
    row(t('state'), o.state) +
    row(t('zip'), o.zip) +
    row(t('country'), cname(o.country)) +
    row(t('phone'), o.phone);
}

// Адреса одним блоком — зручно вставити в кабінет перевізника
function addrText(o) {
  return [o.buyer, o.street,
    [o.zip, o.city].filter(Boolean).join(' '),
    o.state, cname(o.country), o.phone]
    .map(x => String(x || '').trim()).filter(Boolean).join('\n');
}

function copyAddr(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  const txt = addrText(o);
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast(t('copied')), () => {});
  else {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(t('copied')); } catch (e) {}
    ta.remove();
  }
}

function openView(id) {
  const o = orders.find(x => x.id === id);

async function uploadDoc(id) {
  const f = $('f-file').files[0];
  if (!f) return;
  if (f.size > 25 * 1024 * 1024) { toast(t('fileTooBig'), 'error'); return; }
  toast(t('uploading'));
  const b64 = await toB64(f);
  const res = await api('addDoc', { orderId: id, name: f.name, type: val('f-dtype'),
                                    base64: b64.split(',')[1], mimeType: f.type });
  if (res && !res.error) {
    toast(t('fileSaved'));
    $('docs-list').innerHTML = docsList(res.docs, id);
    const o = orders.find(x => x.id === id); if (o) o.docs = res.docs;
    renderOrders();
  } else toast(errMsg(res && res.error), 'error');
}

async function getDoc(orderId, fileId) {
  toast(t('preparing'));
  const res = await api('getDoc', { orderId, fileId });
  if (!res || res.error) { toast(errMsg(res && res.error), 'error'); return; }
  const url = URL.createObjectURL(b64Blob(res.base64, res.mimeType));
  const a = document.createElement('a');
  a.href = url;
  a.download = res.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// base64 → Blob, щоб файл відкривався у новій вкладці
function b64Blob(b64, mime) {
  const bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
  for (let i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || 'application/octet-stream' });
}

// Перегляд файлу в новій вкладці
async function viewDoc(orderId, fileId) {
  const w = window.open('', '_blank');          // відкриваємо одразу, поки є дія користувача
  toast(t('preparing'));
  const res = await api('getDoc', { orderId, fileId });
  if (!res || res.error) { if (w) w.close(); toast(errMsg(res && res.error), 'error'); return; }
  const url = URL.createObjectURL(b64Blob(res.base64, res.mimeType));
  if (w) w.location.href = url;
  else window.open(url, '_blank');              // якщо вкладку заблокував браузер
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function delDoc(orderId, fileId) {
  const res = await api('deleteDoc', { orderId, fileId });
  if (res && !res.error) {
    $('docs-list').innerHTML = docsList(res.docs, orderId);
    const o = orders.find(x => x.id === orderId); if (o) o.docs = res.docs;
    toast(t('fileDeleted')); renderOrders();
  } else toast(errMsg(res && res.error), 'error');
}

/* ══════════ ТОВАРИ ══════════ */
// Ключ категорії товару ('__none__' — без категорії)
function catKey(p) { return (String(p.category || '').trim()) || '__none__'; }

// Усе, за чим шукаємо товар: назва, категорія, SKU товару й SKU варіантів
function skuHaystack(p) {
  const parts = [p.name, p.sku, p.category];
  (p.options || []).forEach(g => {
    parts.push(g.name);
    (g.choices || []).forEach(c => parts.push(c.label, c.sku));
  });
  return parts.filter(Boolean).join(' ').toLowerCase();
}

// Підсвітка збігу
function hl(txt, q) {
  const base = esc(txt == null ? '' : txt);
  if (!q) return base;
  const safe = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return base.replace(new RegExp('(' + safe + ')', 'ig'), '<mark>$1</mark>'); }
  catch (e) { return base; }
}

// SKU варіантів, що збігаються з пошуком
function matchedSkus(p, q) {
  if (!q) return [];
  const out = [];
  (p.options || []).forEach(g => (g.choices || []).forEach(c => {
    if (c.sku && c.sku.toLowerCase().indexOf(q) > -1) out.push(c.sku);
  }));
  return out;
}

function renderCategories() {
  const el = $('cat-side');
  if (!el) return;
  const map = {};
  products.forEach(p => { const k = catKey(p); map[k] = (map[k] || 0) + 1; });
  const keys = Object.keys(map).filter(k => k !== '__none__')
    .sort((a, b) => a.localeCompare(b, L().locale));
  if (map['__none__']) keys.push('__none__');
  if (catFilter !== 'all' && keys.indexOf(catFilter) === -1) catFilter = 'all';
  el.innerHTML = catItem('all', t('allCategories'), products.length) +
    keys.map(k => catItem(k, k === '__none__' ? t('noCategory') : k, map[k])).join('');
}

/* ══════════ Повні фото для карток ══════════ */
const photoCache = {};

function lazyPhotos() {
  const imgs = [...document.querySelectorAll('#products-body img[data-pid]')];
  if (!imgs.length) return;

  const load = async el => {
    if (el.dataset.done) return;
    el.dataset.done = '1';
    const id = el.dataset.pid;
    if (photoCache[id]) { el.src = photoCache[id]; return; }
    const p = products.find(x => x.id === id);
    if (!p || !p.photoId) return;
    const res = await api('getPhoto', { id });
    if (res && !res.error) {
      const url = 'data:' + res.mimeType + ';base64,' + res.base64;
      photoCache[id] = url;
      el.src = url;
    }
  };

  if (!('IntersectionObserver' in window)) { imgs.forEach(load); return; }
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => { if (e.isIntersecting) { load(e.target); obs.unobserve(e.target); } });
  }, { rootMargin: '300px' });
  imgs.forEach(i => io.observe(i));
}

// Оригінали фото в таблиці замовлень — коли рядок видно на екрані
function lazyOrderPhotos() {
  const imgs = [...document.querySelectorAll('#orders-body img[data-photo], #orders-body img[data-pid]')];
  if (!imgs.length) return;

  const load = async el => {
    if (el.dataset.done) return;
    el.dataset.done = '1';
    const photoId = el.dataset.photo, prodId = el.dataset.prod, pid = el.dataset.pid;
    const key = photoId || pid;
    if (photoCache[key]) { el.src = photoCache[key]; return; }
    const res = photoId
      ? await api('getChoicePhoto', { id: prodId, photoId })
      : await api('getPhoto', { id: pid });
    if (res && !res.error) {
      photoCache[key] = 'data:' + res.mimeType + ';base64,' + res.base64;
      el.src = photoCache[key];
    }
  };

  if (!('IntersectionObserver' in window)) { imgs.slice(0, 6).forEach(load); return; }
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => { if (e.isIntersecting) { load(e.target); obs.unobserve(e.target); } });
  }, { rootMargin: '200px' });
  imgs.forEach(i => io.observe(i));
}

// Переведення в гривні за курсом НБУ
function uahOf(a, cur) {
  const rate = cur === 'EUR' ? fx.eurUah : fx.usdUah;
  return rate ? +a * rate : null;
}

// Діапазон цін товару: валюта зверху, гривні під нею
function priceRange(p) {
  const list = [];
  (p.options || []).forEach(g => {
    if (g.price !== '' && g.price !== null && g.price !== undefined && !isNaN(+g.price))
      list.push({ price: +g.price, currency: g.currency === 'EUR' ? 'EUR' : 'USD' });
  });
  if (!list.length) {
    const pu = p.priceUsd !== '' && p.priceUsd != null && !isNaN(+p.priceUsd) ? +p.priceUsd : null;
    const pe = p.priceEur !== '' && p.priceEur != null && !isNaN(+p.priceEur) ? +p.priceEur : null;
    if (pu === null && pe === null) return '<span style="color:var(--text3)">—</span>';
    const main = [pu !== null ? '$' + fmtNum(pu) : '', pe !== null ? '€' + fmtNum(pe) : '']
      .filter(Boolean).join(' · ');
    const u = uahOf(pu !== null ? pu : pe, pu !== null ? 'USD' : 'EUR');
    return `<div style="font-size:16px;font-weight:600;letter-spacing:-0.01em;">${main}</div>` +
      (u === null ? '' : `<div style="font-size:11px;color:var(--text3);margin-top:1px;">≈ ${fmtNum(Math.round(u))} ₴</div>`);
  }

  const cc = list[0].currency;
  if (!list.every(x => x.currency === cc)) return list.map(x => money(x.price, x.currency)).join('<br>');

  const nums = list.map(x => x.price);
  const lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
  const one = lo === hi;
  const main = one ? sym(cc) + fmtNum(lo) : `${sym(cc)}${fmtNum(lo)} – ${sym(cc)}${fmtNum(hi)}`;

  const u1 = uahOf(lo, cc), u2 = uahOf(hi, cc);
  const sub = u1 === null ? '' :
    `≈ ${fmtNum(Math.round(u1))}${one ? '' : ' – ' + fmtNum(Math.round(u2))} ₴`;

  return `<div style="font-size:16px;font-weight:600;letter-spacing:-0.01em;">${main}</div>` +
    (sub ? `<div style="font-size:11px;color:var(--text3);margin-top:1px;">${sub}</div>` : '');
}
