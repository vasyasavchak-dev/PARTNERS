        <div class="field"><label>${t('dimH')}</label><input id="p-h" type="number" min="0" step="0.1" oninput="showDims()" value="${dm.h != null && dm.h !== '' ? dm.h : ''}"></div>
        <div class="field"><label>${t('weight')}</label><input id="p-wt" type="number" min="0" step="0.1" value="${dm.weight != null && dm.weight !== '' ? dm.weight : ''}"></div>
      </div>
      <div id="dims-hint" style="font-size:11px;color:var(--text3);margin:-6px 0 1rem;"></div>

      <div class="sect">${t('basePrice')}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:0.7rem;">${t('basePriceHint')}</div>
      <div class="row">
        <div class="field" style="max-width:170px;"><label>${t('priceUsd')}</label>
          <input id="p-usd" type="number" min="0" step="0.01" value="${p && p.priceUsd !== '' && p.priceUsd != null ? p.priceUsd : ''}"></div>
        <div class="field" style="max-width:170px;"><label>${t('priceEur')}</label>
          <input id="p-eur" type="number" min="0" step="0.01" value="${p && p.priceEur !== '' && p.priceEur != null ? p.priceEur : ''}"></div>
      </div>

      <div id="gprice-box" class="hide">
        <div class="sect">${t('groupPrices')}</div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:0.7rem;">${t('groupPricesHint')}</div>
        <div id="gprices"></div>
      </div>
      <div class="field"><label>${t('description')}</label><textarea id="p-note">${p ? esc(p.note || '') : ''}</textarea></div>
      ${visBlock(p ? p.hiddenFor : [])}
    </div>

    <div class="psec hide" id="ps-vars">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;">
        <div style="font-size:11px;color:var(--text3);max-width:70%;">${t('optionsHint')}</div>
        <div style="display:flex;gap:7px;">
          <button class="btn sm" onclick="resetSkus()"><i class="ti ti-refresh"></i> ${t('resetSku')}</button>
          <button class="btn sm" onclick="addGroup()"><i class="ti ti-plus"></i> ${t('addGroup')}</button>
        </div>
      </div>
      <div id="vars"></div>
    </div>

    <div class="psec hide" id="ps-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;">
        <div style="font-size:11px;color:var(--text3);max-width:70%;">${t('boxesHint')}</div>
        <button class="btn sm" onclick="addBox()"><i class="ti ti-plus"></i> ${t('addBox')}</button>
      </div>
      <div id="boxes"></div>

      <div class="sect" style="margin-top:1.3rem;">${t('shipTitle')}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;">
        <div style="font-size:11px;color:var(--text3);max-width:70%;">${t('shipHint')}</div>
        <button class="btn sm" onclick="addShip()"><i class="ti ti-plus"></i> ${t('addShip')}</button>
      </div>
      <div id="ships"></div>
    </div>

    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn primary" id="save-btn" onclick="saveProduct(${p ? `'${p.id}'` : 'null'})">${t('save')}</button>
    </div>`);
  (p ? (p.options || []) : []).forEach(addGroup);
  renderGPrices();
  (p ? (p.boxes || []) : []).forEach(addBox);
  (p ? (p.shipping || []) : []).forEach(addShip);
  showDims();
  pCount();
  $('modal-box').addEventListener('input', pCount);
  $('modal-box').addEventListener('click', () => setTimeout(pCount, 0));
}

// Перемикання вкладок усередині картки товару
function pTab(name) {
  if (name !== 'main') readGPrices();
  document.querySelectorAll('.ptab').forEach(b => b.classList.toggle('active', b.dataset.s === name));
  document.querySelectorAll('.psec').forEach(x => x.classList.toggle('hide', x.id !== 'ps-' + name));
  if (name === 'main') renderGPrices();
}

// Скільки даних уже введено на кожній вкладці
function pCount() {
  const set = (id, n) => {
    const el = $(id);
    if (!el) return;
    el.textContent = n;
    el.classList.toggle('on', n > 0);
  };
  // Основне: заповнені поля
  let main = 0;
  ['p-name','p-cat','p-note','p-l','p-w','p-h','p-wt'].forEach(x => { if (val(x).trim()) main++; });
  if (val('p-thumb') || ($('p-photo-prev') && $('p-photo-prev').tagName === 'IMG' && !val('p-rmphoto'))) main++;
  set('pb-main', main);

  // Варіанти: усі варіанти вибору в усіх групах
  let ch = 0;
  document.querySelectorAll('#vars .ogroup').forEach(b => {
    b.querySelectorAll('.ochoice').forEach(r => {
      const lab = r.querySelector('.c-label');
      if (lab && lab.value.trim()) ch++;
    });
  });
  set('pb-vars', ch);

  set('pb-box', document.querySelectorAll('#boxes .ochoice').length +
                document.querySelectorAll('#ships .ochoice').length);
}

// Габарити в дюймах під полями
function showDims() {
  pCount();
  const el = $('dims-hint');
  if (!el) return;
  const l = +val('p-l'), w = +val('p-w'), h = +val('p-h');
  if (!l && !w && !h) { el.textContent = ''; return; }
  const inch = v => v ? (v / 2.54).toFixed(1) : '0';
  el.textContent = `≈ ${inch(l)} × ${inch(w)} × ${inch(h)} ″`;
}

// Коробки
function addBox(b) {
  b = b || { l:'', w:'', h:'', weight:'', cost:'', note:'' };
  const d = document.createElement('div');
  d.className = 'ochoice';
  d.innerHTML = `
    <input class="b-l" type="number" min="0" step="0.1" style="width:74px;" placeholder="${t('dimL')}" value="${b.l !== '' && b.l != null ? b.l : ''}">
    <input class="b-w" type="number" min="0" step="0.1" style="width:74px;" placeholder="${t('dimW')}" value="${b.w !== '' && b.w != null ? b.w : ''}">
    <input class="b-h" type="number" min="0" step="0.1" style="width:74px;" placeholder="${t('dimH')}" value="${b.h !== '' && b.h != null ? b.h : ''}">
    <input class="b-wt" type="number" min="0" step="0.1" style="width:74px;" placeholder="${t('weight')}" value="${b.weight !== '' && b.weight != null ? b.weight : ''}">
    <input class="b-cost" type="number" min="0" step="0.01" style="width:84px;" placeholder="${t('boxCost')}" value="${b.cost !== '' && b.cost != null ? b.cost : ''}">
    <input class="b-note" style="flex:1;min-width:110px;" placeholder="${t('boxNote')}" value="${esc(b.note || '')}">
    <button class="icon-btn" onclick="this.closest('.ochoice').remove()"><i class="ti ti-x"></i></button>`;
  $('boxes').appendChild(d);
}

// Напрямки доставки
const SHIP_ZONES = () => [['EU', t('zEU')], ['EUR', t('zEUR')], ['ELSE', t('zELSE')]]
  .concat(Object.keys(COUNTRIES).filter(c => c !== 'other').map(c => [c, cname(c)]));

function shipZoneOpts(sel) {
  return SHIP_ZONES().map(([v, n]) =>
    `<option value="${v}" ${v === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');
}

function addShip(x) {
  x = x || { zone: 'ELSE', price: '', currency: myCur() };
  const d = document.createElement('div');
  d.className = 'ochoice';
  const num = (v) => v !== '' && v != null ? v : '';
  d.innerHTML = `
    <select class="s-zone" style="flex:1;min-width:150px;">${shipZoneOpts(x.zone)}</select>
    <input class="s-price" type="number" min="0" step="0.01" style="width:120px;"
      placeholder="${t('shipOne')}" value="${num(x.price)}">
    <select class="s-cur" style="width:76px;">${curOpts(x.currency)}</select>
    <button class="icon-btn" onclick="this.closest('.ochoice').remove()"><i class="ti ti-x"></i></button>`;
  $('ships').appendChild(d);
}

function collectShips() {
  return [...document.querySelectorAll('#ships .ochoice')].map(r => ({
    zone: r.querySelector('.s-zone').value,
    price: r.querySelector('.s-price').value,
    currency: r.querySelector('.s-cur').value
  })).filter(x => x.price !== '');
}

// Ціна доставки товару в конкретну країну: країна → ЄС / Європа → решта світу
const EU_CC = ['DE','FR','IT','ES','NL','BE','AT','SE','DK','FI','PL','CZ','SK','HU','RO','PT','GR','IE'];
function shipFor(p, cc) {
  const list = (p && p.shipping) || [];
  const by = z => list.find(x => x.zone === z);
  return by(cc)
      || (EU_CC.indexOf(cc) > -1 ? by('EU') : null)
      || (['GB','CH','NO','UA'].indexOf(cc) > -1 ? by('EUR') : null)
      || by('ELSE') || null;
}

function collectBoxes() {
  return [...document.querySelectorAll('#boxes .ochoice')].map(r => ({
    l: r.querySelector('.b-l').value, w: r.querySelector('.b-w').value, h: r.querySelector('.b-h').value,
    weight: r.querySelector('.b-wt').value, cost: r.querySelector('.b-cost').value,
    note: r.querySelector('.b-note').value.trim()
  })).filter(b => b.l || b.w || b.h || b.weight);
}

/* ══════════ Редактор груп опцій ══════════ */
let gSeq = 0;
function addGroup(g) {
  g = g && g.id ? g : { id: '', name: '', kind: 'text', req: true, choices: [] };
  const box = document.createElement('div');
  box.className = 'ogroup';
  box.dataset.key = g.id || ('tmp' + (++gSeq));
  box.dataset.price = g.price === '' || g.price == null ? '' : g.price;
  box.dataset.cur = g.currency || myCur();
  box.innerHTML = `
    <input type="hidden" class="g-id" value="${esc(g.id)}">
    <div class="ohead">
      <input class="g-name" placeholder="${t('groupNamePh')}" value="${esc(g.name)}">
      <select class="g-kind" onchange="redrawChoices(this)">
        <option value="text" ${g.kind !== 'color' ? 'selected' : ''}>${t('kindText')}</option>
        <option value="color" ${g.kind === 'color' ? 'selected' : ''}>${t('kindColor')}</option>
      </select>
      <label class="greq"><input type="checkbox" class="g-req" ${g.req === false ? '' : 'checked'}> ${t('reqGroup')}</label>
      <button class="icon-btn" onclick="this.closest('.ogroup').remove()"><i class="ti ti-trash"></i></button>
    </div>
    <div class="g-choices"></div>
    <button class="btn xs" onclick="addChoice(this.closest('.ogroup'))"><i class="ti ti-plus"></i> ${t('addChoice')}</button>`;
  $('vars').appendChild(box);
  (g.choices || []).forEach(c => addChoice(box, c));
  if (!(g.choices || []).length) addChoice(box);
}

function redrawChoices(sel) {
  const box = sel.closest('.ogroup');
  const list = collectChoices(box);
  box.querySelector('.g-choices').innerHTML = '';
  list.forEach(c => addChoice(box, c));
  if (!list.length) addChoice(box);
}

function addChoice(box, c) {
  c = c && (c.id || c.label) ? c : { id: '', sku: '', label: '', hex: '', imgs: [] };
  const kind = box.querySelector('.g-kind').value;
  const row = document.createElement('div');
  row.className = 'ochoice';
  const labelField = kind === 'color'
    ? `<select class="c-label" style="flex:2;" onchange="choiceHex(this)">
         <option value="">${t('colorDash')}</option>
         ${colors.map(x => `<option value="${esc(x.name)}" data-hex="${x.hex}" ${c.label === x.name ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
       </select>
       <span class="dot lg c-dot" style="${colorStyle(c.hex, c.label)}margin:0;"></span>`
    : `<input class="c-label" style="flex:2;" placeholder="${t('choicePh')}" value="${esc(c.label)}">`;
  row.innerHTML = `
    <input type="hidden" class="c-id" value="${esc(c.id)}">
    <input type="hidden" class="c-hex" value="${esc(c.hex || '')}">
    ${labelField}
    <input class="c-sku mono" style="width:130px;" placeholder="${t('auto')}" value="${esc(c.sku || '')}">
    <button class="icon-btn" onclick="this.closest('.ochoice').remove()"><i class="ti ti-x"></i></button>
    <input type="hidden" class="c-imgs" value="${esc(JSON.stringify(c.imgs || []))}">
    <div class="oimgs"></div>
    <input type="file" class="c-file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="pickChoiceImg(this)">`;
  box.querySelector('.g-choices').appendChild(row);
  renderChoiceImgs(row);
}

function choiceHex(sel) {
  const opt = sel.options[sel.selectedIndex];
  const hex = opt.getAttribute('data-hex') || '';
  const row = sel.closest('.ochoice');
  row.querySelector('.c-hex').value = hex;
  const dot = row.querySelector('.c-dot');
  if (dot) dot.style.cssText = colorStyle(hex, sel.value) + 'margin:0;';
}

function getImgs(row) {
  try { return JSON.parse(row.querySelector('.c-imgs').value || '[]'); } catch (e) { return []; }
}
function setImgs(row, list) {
  row.querySelector('.c-imgs').value = JSON.stringify(list);
  renderChoiceImgs(row);
}
function renderChoiceImgs(row) {
  const list = getImgs(row);
  row.querySelector('.oimgs').innerHTML =
    list.map((im, i) => `<div class="oimg">
      <span class="pic" style="background-image:url(${im.thumb || ''})"></span>
      <input class="cap" value="${esc(im.cap || '')}" placeholder="${t('photoCap')}"
        onchange="capImg(this, ${i})">
      <button class="rm" onclick="delImg(this, ${i})">&times;</button>
    </div>`).join('') +
    `<div class="oadd" onclick="this.closest('.ochoice').querySelector('.c-file').click()">+</div>`;
}
function capImg(inp, i) {
  const row = inp.closest('.ochoice');
  const list = getImgs(row);
  if (list[i]) { list[i].cap = inp.value.trim(); row.querySelector('.c-imgs').value = JSON.stringify(list); }
}
function delImg(btn, i) {
  const row = btn.closest('.ochoice');
  const list = getImgs(row);
  list.splice(i, 1);
  setImgs(row, list);
}
function pickChoiceImg(input) {
  const f = input.files[0];
  if (!f) return;
  const row = input.closest('.ochoice');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const thumb = fitThumb(img, 260, 200);
      const full = resizeImg(img, 1400, false, 0.82);
      if (!thumb) { toast(t('photoTooBig'), 'error'); return; }
      const list = getImgs(row);
      if (list.length >= 12) { toast(t('photoLimit'), 'error'); return; }
      list.push({ thumb, base64: full.split(',')[1], mimeType: 'image/jpeg', cap: '' });
      setImgs(row, list);
      input.value = '';
    };
    img.onerror = () => toast(t('logoBadRead'), 'error');
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

// Очистити SKU варіантів — згенеруються заново при збереженні
function resetSkus() {
  const list = document.querySelectorAll('#vars .c-sku');
  list.forEach(i => { i.value = ''; });
  toast(t('skuReset', { n: list.length }));
}

function collectChoices(box) {
  return [...box.querySelectorAll('.ochoice')].map(r => {
    const lab = r.querySelector('.c-label');
    return {
      id: r.querySelector('.c-id').value,
      sku: r.querySelector('.c-sku').value.trim(),
      label: lab.value.trim(),
      hex: r.querySelector('.c-hex').value,
      imgs: getImgs(r)
    };
  }).filter(c => c.label);
}

function collectGroups() {
  readGPrices();
  return [...document.querySelectorAll('#vars .ogroup')].map(b => ({
    id: b.querySelector('.g-id').value,
    name: b.querySelector('.g-name').value.trim(),
    kind: b.querySelector('.g-kind').value,
    req: b.querySelector('.g-req').checked,
    price: b.dataset.price || '',
    currency: b.dataset.cur || myCur(),
    choices: collectChoices(b)
  })).filter(g => g.name && g.choices.length);
}

/* Ціни груп — на вкладці «Основне», під розмірами */
function renderGPrices() {
  const wrap = $('gprices'), box = $('gprice-box');
  if (!wrap) return;
  readGPrices();
  const groups = [...document.querySelectorAll('#vars .ogroup')]
    .filter(b => b.querySelector('.g-name').value.trim());
  box.classList.remove('hide');
  if (!groups.length) { wrap.innerHTML = `<div style="font-size:12px;color:var(--text3);">${t('noGroupsYet')}</div>`; return; }
  wrap.innerHTML = groups.map(b => `<div class="ochoice gprice" data-key="${esc(b.dataset.key)}">
    <div style="flex:1;min-width:140px;font-size:13px;">${esc(b.querySelector('.g-name').value.trim())}</div>
    <input class="gp-price" type="number" min="0" step="0.01" style="width:120px;"
      placeholder="${t('colPrice')}" value="${esc(b.dataset.price || '')}">
    <select class="gp-cur" style="width:76px;">${curOpts(b.dataset.cur || myCur())}</select>
  </div>`).join('');
}

// Запам'ятовує введені ціни назад у групи
function readGPrices() {
  document.querySelectorAll('#gprices .gprice').forEach(r => {
    const b = [...document.querySelectorAll('#vars .ogroup')].find(x => x.dataset.key === r.dataset.key);
    if (!b) return;
    b.dataset.price = r.querySelector('.gp-price').value;
    b.dataset.cur = r.querySelector('.gp-cur').value;
  });
}

async function saveProduct(id) {
  const name = val('p-name').trim();
  if (!name) { toast(t('needProdName'), 'error'); return; }
  const data = { name, sku: val('p-sku').trim(), category: val('p-cat').trim(),
                 priceUsd: val('p-usd'), priceEur: val('p-eur'),
                 note: val('p-note').trim(), options: collectGroups(),
                 dims: { l: val('p-l'), w: val('p-w'), h: val('p-h'), weight: val('p-wt') },
                 boxes: collectBoxes(), shipping: collectShips(), hiddenFor: pickedHidden() };
  if (val('p-thumb')) data.photo = { thumb: val('p-thumb'), base64: val('p-full').split(',')[1], mimeType: 'image/jpeg' };
  else if (val('p-rmphoto')) data.removePhoto = true;
  busy('save-btn');
  const res = id ? await api('updateProduct', Object.assign({ id }, data)) : await api('addProduct', data);
  if (res && !res.error) { toast(id ? t('productSaved') : t('productAdded')); closeModal(); loadAll(); }
  else { toast(errMsg(res && res.error), 'error'); unbusy('save-btn', t('save')); }
}

// Дублювання товару
function dupProduct(id, name) {
  modal(`<h2><i class="ti ti-copy"></i> ${t('duplicateQ')}</h2>
    <p style="font-size:14px;color:var(--text2);margin-bottom:0.6rem;">${esc(name)}</p>
    <div style="font-size:12px;color:var(--text3);">${t('duplicateHint')}</div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn primary" id="save-btn" onclick="doDupProduct('${id}')"><i class="ti ti-copy"></i> ${t('duplicate')}</button></div>`);
}

async function doDupProduct(id) {
  busy('save-btn');
  const res = await api('duplicateProduct', { id });
  if (res && !res.error) {
    toast(t('duplicated', { n: res.name }));
    closeModal();
    await loadAll();
    if (res.id) openProduct(res.id);
  } else { toast(errMsg(res && res.error), 'error'); unbusy('save-btn', t('duplicate')); }
}

function delProduct(id, name) {
  modal(`<h2>${t('deleteProductQ')}</h2>
    <p style="font-size:14px;color:var(--text2);margin-bottom:1.5rem;">${esc(name)}</p>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn danger" id="save-btn" onclick="doDelProduct('${id}')"><i class="ti ti-trash"></i> ${t('delete')}</button></div>`);
}
async function doDelProduct(id) {
  busy('save-btn');
  const res = await api('deleteProduct', { id });
  if (res && !res.error) { toast(t('productDeleted')); closeModal(); loadAll(); }
  else { toast(errMsg(res && res.error), 'error'); unbusy('save-btn', t('delete')); }
}

/* ══════════ ПАЛІТРА ══════════ */
function openColors() {
  modal(`<h2><i class="ti ti-palette"></i> ${t('palette')}
    <button class="btn sm" style="margin-left:auto;" onclick="addColor()"><i class="ti ti-plus"></i> ${t('btnColor')}</button></h2>
    <div id="cols"></div>
    <div style="font-size:11px;color:var(--text3);margin-top:8px;">${t('paletteHint')}</div>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn primary" id="save-btn" onclick="saveColors()">${t('save')}</button></div>`);
  colors.forEach(addColor);
  if (!colors.length) addColor();
}

function addColor(c) {
  c = c && c.name ? c : { name:'', hex:'#C7A57A', img:'' };
  const d = document.createElement('div');
  d.className = 'vrow';
  d.innerHTML = `
    <input type="hidden" class="c-hex" value="${c.hex || '#C7A57A'}">
    <span class="cimg" title="${t('colorPhoto')}" style="${c.img ? `background-image:url(${c.img})` : ''}"
      onclick="this.parentNode.querySelector('.c-file').click()">${c.img ? '' : '<i class="ti ti-camera"></i>'}</span>
    <input type="file" class="c-file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="pickColorImg(this)">
    <input type="hidden" class="c-img" value="${esc(c.img || '')}">
    <input class="c-name" style="flex:1;" placeholder="${t('colorName')}" value="${esc(c.name)}">
    <button class="icon-btn" onclick="clearColorImg(this)" title="${t('clearPhoto')}"><i class="ti ti-photo-off"></i></button>
    <button class="icon-btn" onclick="this.parentNode.remove()"><i class="ti ti-x"></i></button>`;
  $('cols').appendChild(d);
}

// Знімок кольору: квадрат 150px у рядок палітри
/* ══════════ Обробка зображень ══════════ */
// Мініатюра під пропорції картки (4:3). Якість підбирається під ліміт комірки таблиці.
function makeThumb(img, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  const want = w / h, have = img.width / img.height;
  let sw = img.width, sh = img.height, sx = 0, sy = 0;
  if (have > want) { sw = img.height * want; sx = (img.width - sw) / 2; }
  else { sh = img.width / want; sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  for (let q = 0.86; q >= 0.4; q -= 0.07) {
    const d = c.toDataURL('image/jpeg', q);
    if (d.length <= 47000) return d;
  }
  return null;
}

// Мініатюра без обрізання — вписуємо фото цілком
function fitThumb(img, maxW, maxH) {
  const k = Math.min(maxW / img.width, maxH / img.height, 1);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * k));
  c.height = Math.max(1, Math.round(img.height * k));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  for (let q = 0.86; q >= 0.4; q -= 0.07) {
    const d = c.toDataURL('image/jpeg', q);
    if (d.length <= 47000) return d;
  }
  return null;
}

// Квадратний знімок кольору для палітри
function makeSwatch(img) {
  const S = 150, c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  const side = Math.min(img.width, img.height);
  ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
  for (let q = 0.84; q >= 0.4; q -= 0.08) {
    const d = c.toDataURL('image/jpeg', q);
    if (d.length <= 45000) return d;
  }
  return null;
}

// Зменшення зі збереженням пропорцій — для оригіналу в Drive
function resizeImg(img, size, square, q) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  if (square) {
    c.width = c.height = size;
    const side = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
  } else {
    const k = Math.min(1, size / Math.max(img.width, img.height));
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    ctx.drawImage(img, 0, 0, c.width, c.height);
  }
  return c.toDataURL('image/jpeg', q);
}

// Головне фото товару
function pickPhoto(input) {
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const thumb = makeThumb(img, 560, 420);
      if (!thumb) { toast(t('photoTooBig'), 'error'); return; }
      const full = resizeImg(img, 1400, false, 0.82);
      $('p-thumb').value = thumb;
      $('p-full').value = full;
      $('p-rmphoto').value = '';
      const prev = $('p-photo-prev');
      const im = document.createElement('img');
      im.className = 'photo-prev'; im.id = 'p-photo-prev'; im.src = thumb;
      prev.replaceWith(im);
      toast(t('photoAttached', { n: Math.round(thumb.length / 1024) }));
      if (typeof pCount === 'function') pCount();
    };
    img.onerror = () => toast(t('logoBadRead'), 'error');
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function clearPhoto() {
  $('p-thumb').value = ''; $('p-full').value = ''; $('p-rmphoto').value = '1';
  const prev = $('p-photo-prev');
  const d = document.createElement('div');
  d.className = 'photo-prev empty'; d.id = 'p-photo-prev'; d.textContent = t('noPhoto');
  prev.replaceWith(d);
  if (typeof pCount === 'function') pCount();
}

// Повне фото товару у вікні
async function openPhoto(id) {
  const p = products.find(x => x.id === id);
  modal(`<h2>${esc(p ? p.name : '')}</h2>
    <img class="photo-big" src="${photoCache[id] || (p && p.thumb) || ''}" id="big-photo" alt="">
    <div class="modal-footer"><button class="btn" onclick="closeModal()">${t('close')}</button></div>`);
  if (photoCache[id]) return;
  const res = await api('getPhoto', { id });
  if (res && !res.error) {
    photoCache[id] = 'data:' + res.mimeType + ';base64,' + res.base64;
    const el = $('big-photo');
    if (el) el.src = photoCache[id];
  }
}

function pickColorImg(input) {
  const f = input.files[0];
  if (!f) return;
  const row = input.closest('.vrow');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const data = makeSwatch(img);
      if (!data) { toast(t('photoTooBig'), 'error'); return; }
      row.querySelector('.c-img').value = data;
      const box = row.querySelector('.cimg');
      box.style.backgroundImage = `url(${data})`;
      box.innerHTML = '';
      toast(t('photoAttached', { n: Math.round(data.length / 1024) }));
    };
    img.onerror = () => toast(t('logoBadRead'), 'error');
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function clearColorImg(btn) {
  const row = btn.closest('.vrow');
  row.querySelector('.c-img').value = '';
  const box = row.querySelector('.cimg');
  box.style.backgroundImage = '';
  box.innerHTML = '<i class="ti ti-camera"></i>';
}

async function saveColors() {
  const list = [...document.querySelectorAll('#cols .vrow')].map(r => ({
    name: r.querySelector('.c-name').value.trim(),
    hex: r.querySelector('.c-hex').value,
    img: r.querySelector('.c-img').value
  })).filter(c => c.name);
  busy('save-btn');
  const withImg = list.filter(c => c.img).length;
  const res = await api('saveColors', { colors: list });
  if (res && !res.error) {
    colors = res.colors;
    const kept = (res.colors || []).filter(c => c.img).length;
    if (withImg && kept < withImg) toast(t('photoLost'), 'error');
    else toast(t('paletteSaved'));
    closeModal(); loadAll();
  }
  else { toast(errMsg(res && res.error), 'error'); unbusy('save-btn', t('save')); }
}

function addBotRow(b) {
  b = b || { chat: '', token: '' };
  const d = document.createElement('div');
  d.className = 'ochoice';
  d.innerHTML = `
    <input class="tb-chat mono" style="width:140px;" placeholder="${t('tgChat')}" value="${esc(b.chat || '')}">
    <input class="tb-token mono" style="flex:1;min-width:180px;" placeholder="${t('tgTokenPh')}" value="${esc(b.token || '')}">
    <button class="btn xs" onclick="findChat(this)" title="${t('findChat')}"><i class="ti ti-search"></i> ID</button>
    <button class="icon-btn" onclick="this.closest('.ochoice').remove()"><i class="ti ti-x"></i></button>`;
  $('u-bots').appendChild(d);

// Запитує в Telegram, хто писав цьому боту, і підставляє chat id.
// Список показуємо прямо в рядку, щоб не закривати картку партнера.
async function findChat(btn) {
  const row = btn.closest('.ochoice');
  const token = row.querySelector('.tb-token').value.trim();
  if (!token) { toast(t('needToken'), 'error'); return; }
  const old = row.querySelector('.chatpick');
  if (old) old.remove();
  btn.disabled = true;
  const res = await api('tgChats', { botToken: token });
  btn.disabled = false;
  if (!res || res.error) { toast(errMsg(res && res.error), 'error'); return; }
  if (!res.chats.length) { toast(t('noChats', { b: res.bot }), 'error'); return; }

  const box = document.createElement('div');
  box.className = 'chatpick';
  box.innerHTML = `<div class="cp-head">${esc(res.bot)} · ${t('pickChat')}</div>` +
    res.chats.map(c => `<div class="cp-row" onclick="useChat(this,'${esc(c.id)}')">
      <span>${esc(c.name || '—')}</span><span class="mono">${esc(c.id)}</span></div>`).join('');
  row.appendChild(box);
}

function useChat(el, id) {
  const row = el.closest('.ochoice');
  row.querySelector('.tb-chat').value = id;
  const box = row.querySelector('.chatpick');
  if (box) box.remove();
}

function collectBots() {
  return [...document.querySelectorAll('#u-bots .ochoice')].map(r => ({
    chat: r.querySelector('.tb-chat').value.trim(),
    token: r.querySelector('.tb-token').value.trim()
  })).filter(b => b.chat || b.token);   // для «дзеркала» достатньо самого chat id
}

function pickLogo(input) {
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 96, c = document.createElement('canvas');
      c.width = c.height = S;
      const ctx = c.getContext('2d');
      const side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
      const data = c.toDataURL('image/png');
      if (data.length > 47000) { toast(t('logoTooBig'), 'error'); return; }
      $('u-logo').value = data;
      $('u-logo-prev').src = data;
    };
    img.onerror = () => toast(t('logoBadRead'), 'error');
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function clearLogo() { $('u-logo').value = ''; $('u-logo-prev').removeAttribute('src'); }

async function saveUser(id) {
  const data = { name: val('u-name').trim(), company: val('u-company').trim(), logo: val('u-logo'),
                 lang: val('u-lang'), currency: val('u-cur'),
                 tgBots: collectBots(), tgMirror: $('u-mirror').checked, email: val('u-email').trim(),
                 admin: $('u-admin').checked };
  const pass = val('u-pass');
  if (!data.name) { toast(t('needName'), 'error'); return; }
  busy('save-btn');
  let res;
  if (id) {
    data.login = val('u-login').trim();
    if (pass) data.password = pass;
    res = await api('updateUser', Object.assign({ id }, data));
  } else {
    data.login = val('u-login').trim();
    data.password = pass;
    res = await api('addUser', data);
  }
  if (res && !res.error) { toast(t('saved')); closeModal(); loadUsers(); loadAll(); }
  else { toast(errMsg(res && res.error), 'error'); unbusy('save-btn', t('save')); }
}

async function toggleUser(id, active) {
  const res = await api('updateUser', { id, active });
  if (res && !res.error) { toast(active ? t('partnerOn') : t('partnerOff')); loadUsers(); loadAll(); }
  else toast(errMsg(res && res.error), 'error');
}

/* ══════════ ДРІБНИЦІ ══════════ */
function $(id) { return document.getElementById(id); }
function val(id) { const e = $(id); return e ? e.value : ''; }
function toggle(id, show) { const e = $(id); if (e) e.classList.toggle('hide', !show); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function modal(html) { $('modal-box').innerHTML = html; $('modal-bg').classList.add('open'); }
function closeModal() { $('modal-bg').classList.remove('open'); }
$('modal-bg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

function busy(id) { const b = $(id); if (b) { b.disabled = true; b.innerHTML = '<span class="spinner"></span>'; } }
function unbusy(id, txt) { const b = $(id); if (b) { b.disabled = false; b.textContent = txt; } }

function sync(on) {
  $('sync-status').innerHTML = on
    ? `<span class="spinner"></span> ${t('loading')}`
    : `<i class="ti ti-cloud-check" style="color:#3B6D11"></i> ${t('syncOk')}`;
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'success');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function flag(c) {
  const code = COUNTRIES[c] ? (c === 'other' ? '••' : String(c).toUpperCase()) : '••';
  return '<span class="cc">' + code + '</span>';
}
function cname(c) { return COUNTRIES[c] ? COUNTRIES[c][LANG === 'en' ? 2 : 1] : (c || ''); }
function countryOpts(sel) {
  return Object.keys(COUNTRIES).map(c =>
    `<option value="${c}" ${c === (sel || 'US') ? 'selected' : ''}>${cname(c)}</option>`).join('');
}

function parseDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function ts(v) { const d = parseDate(v); return d ? d.getTime() : 0; }
function monthKey(o) {
  const d = parseDate(o.created);
  return d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') : '';
}
function fmtDate(v) {
  const d = parseDate(v);
  if (!d) return '—';
  const dd = String(d.getDate()).padStart(2, '0'), mm = String(d.getMonth() + 1).padStart(2, '0');
  return LANG === 'en' ? `${mm}/${dd}/${d.getFullYear()}` : `${dd}.${mm}.${d.getFullYear()}`;
}
function fmtDateTime(v) {
  const d = parseDate(v);
  return d ? d.toLocaleString(L().locale) : '—';
}

function toB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
